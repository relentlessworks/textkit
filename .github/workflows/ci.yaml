name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '*.md', 'LICENSE']
  pull_request:
    branches: [main]
    paths-ignore: ['docs/**', '*.md', 'LICENSE']

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...
      - run: CGO_ENABLED=0 go build -trimpath ./cmd/textkit

  cross-compile:
    needs: check
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          go build -trimpath -ldflags "-s -w" -o textkit-${GOOS}-${GOARCH}${ext} ./cmd/textkit
      - uses: actions/upload-artifact@v4
        with:
          name: textkit-${{ matrix.goos }}-${{ matrix.goarch }}
          path: textkit-*
